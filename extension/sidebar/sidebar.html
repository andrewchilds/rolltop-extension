<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolltop</title>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<nav aria-label="Tabs">
  <div class="top">
  <div class="search">
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" type="text" aria-label="Search tabs, groups and the archive" placeholder="Search tabs, groups, archive" autocomplete="off" spellcheck="false">
  </div>
    <button type="button" class="icon-btn" data-act="settings" aria-label="Rolltop settings" title="Rolltop settings">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="8" cy="8" r="4.2" stroke-width="1.5"/><circle cx="8" cy="8" r="1.4" stroke-width="1.3"/><path stroke-width="2.2" d="M13 8h1.5M3 8H1.5M8 13v1.5M8 3V1.5M11.54 11.54l1.06 1.06M4.46 11.54L3.4 12.6M4.46 4.46L3.4 3.4M11.54 4.46L12.6 3.4"/></svg>
    </button>
  </div>

  <div id="browse" class="browse">
    <div id="pins" class="pins" aria-label="Pinned tabs" hidden></div>
    <div id="list" class="tablist"></div>
  </div>

  <div id="results" class="results" hidden></div>

  <p id="notice" class="notice" role="status" hidden></p>

  <div class="footer">
    <button type="button" class="icon-btn" data-act="newTab" aria-label="New tab" title="New tab">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>
    </button>
  </div>
</nav>
<script type="module" src="sidebar.js"></script>
</body>
</html>
